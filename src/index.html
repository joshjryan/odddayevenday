<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Odd / Even Day</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="card">
      <h1>Odd or Even?</h1>
      <p class="subtitle">School day status at a glance</p>

      <section class="hero" aria-live="polite">
        <p id="today-context" class="hero-context">Today</p>
        <p id="today-parity" class="hero-parity">--</p>
        <p id="today-date" class="hero-date">--</p>
        <p id="today-note" class="hero-note"></p>
      </section>

      <section class="next-card" aria-label="Next school day details">
        <div class="next-grid row">
          <p class="label">Next school day</p>
          <p id="next-school-day" class="value">--</p>
        </div>
        <div class="next-grid row">
          <p class="label">When</p>
          <p id="next-relative" class="value">--</p>
        </div>
        <div class="next-grid row">
          <p class="label">Schedule</p>
          <p id="next-parity" class="value">--</p>
        </div>
        <div class="next-grid row">
          <p class="label">Days until school</p>
          <p id="next-school-day-count" class="value">--</p>
        </div>
      </section>

      <section class="upcoming-strip" aria-label="Upcoming schedule glance">
        <p class="label">Upcoming</p>
        <div id="upcoming-glance" class="chip-row" role="list"></div>
      </section>

      <details class="upcoming" id="upcoming-panel">
        <summary>See next school days</summary>
        <ul id="upcoming-list" class="upcoming-list"></ul>
      </details>

      <p id="status" class="status"></p>
    </main>

    <script src="schedule-data.js"></script>
    <script src="app.js" type="module"></script>
  </body>
</html>
