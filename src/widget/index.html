<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <title>Odd / Even Widget</title>
    <link rel="stylesheet" href="../styles.css" />
  </head>
  <body class="widget-page">
    <main class="widget" aria-live="polite">
      <section class="widget-today" aria-label="Today's school schedule">
        <p id="today-context" class="widget-label">Today</p>
        <p id="today-parity" class="widget-parity">--</p>
        <p id="today-date" class="widget-date">--</p>
        <p id="today-note" class="widget-note"></p>
      </section>

      <section class="widget-next" aria-label="Next school day">
        <p class="widget-label">Next school day</p>
        <p id="next-parity" class="widget-next-parity">--</p>
        <p id="next-school-day" class="widget-date">--</p>
        <p id="next-relative" class="widget-relative">--</p>
        <p id="next-school-day-count" hidden></p>
        <p id="next-other-note-row" hidden><span id="next-other-note"></span></p>
      </section>

      <p id="status" class="widget-status"></p>
    </main>

    <script src="../schedule-data.js"></script>
    <script src="../app.js" type="module"></script>
  </body>
</html>
